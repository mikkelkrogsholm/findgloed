services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - default
      - findgloed_app_edge
    restart: always

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  meilisearch:
    image: getmeili/meilisearch:v1.45.1
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: always

  meili-bootstrap:
    build:
      context: ./content-site
      dockerfile: Dockerfile
      target: search-runtime
      args:
        BUN_VERSION: "1.3.14"
    command: ["bun", "run", "search:bootstrap"]
    environment:
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ARTICLE_INDEX: ${MEILI_ARTICLE_INDEX:-articles}
      MEILI_SEARCH_KEY_FILE: /run/meilisearch/search-key
    volumes:
      - meilisearch_runtime:/run/meilisearch
    depends_on:
      meilisearch:
        condition: service_healthy
    restart: "no"

  content-indexer:
    build:
      context: ./content-site
      dockerfile: Dockerfile
      target: search-runtime
      args:
        BUN_VERSION: "1.3.14"
    command: ["bun", "run", "search:index"]
    environment:
      CONTENT_ARTICLES_ROOT: /workspace/knowledge/docs/knowledge/redaktion/artikler
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ARTICLE_INDEX: ${MEILI_ARTICLE_INDEX:-articles}
    depends_on:
      meili-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 39564
      DB_HOST: db
      DB_PORT: 5432
      DB_SSL: "false"
      REDIS_URL: redis://redis:6379
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
      DATA_CONTROLLER_NAME: ${DATA_CONTROLLER_NAME}
      DATA_CONTROLLER_EMAIL: ${DATA_CONTROLLER_EMAIL}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TRUST_PROXY: "true"
      RATE_LIMIT_FAIL_OPEN: "false"
      ENABLE_HSTS: "false"
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED}
      RATE_LIMIT_WAITLIST_MAX: ${RATE_LIMIT_WAITLIST_MAX}
      RATE_LIMIT_WAITLIST_WINDOW_SECONDS: ${RATE_LIMIT_WAITLIST_WINDOW_SECONDS}
      RATE_LIMIT_CONFIRM_MAX: ${RATE_LIMIT_CONFIRM_MAX}
      RATE_LIMIT_CONFIRM_WINDOW_SECONDS: ${RATE_LIMIT_CONFIRM_WINDOW_SECONDS}
      WAITLIST_CONFIRM_PATH: ${WAITLIST_CONFIRM_PATH}
      PARTNER_CONFIRM_PATH: ${PARTNER_CONFIRM_PATH}
      WAITLIST_CONFIRM_TOKEN_TTL_HOURS: ${WAITLIST_CONFIRM_TOKEN_TTL_HOURS}
      WAITLIST_RESEND_COOLDOWN_MINUTES: ${WAITLIST_RESEND_COOLDOWN_MINUTES}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED}
      HSTS_MAX_AGE_SECONDS: ${HSTS_MAX_AGE_SECONDS}
      MEILI_HOST: http://meilisearch:7700
      MEILI_ARTICLE_INDEX: ${MEILI_ARTICLE_INDEX:-articles}
      MEILI_SEARCH_KEY_FILE: /run/meilisearch/search-key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      content-indexer:
        condition: service_completed_successfully
    volumes:
      # Profil-fotos og verificeringsfiler skal overleve container-rebuild.
      # Default uploads-root er process.cwd()/uploads = /app/uploads (jf. Dockerfile WORKDIR /app).
      - findgloed_uploads:/app/uploads
      - meilisearch_runtime:/run/meilisearch:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:39564/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      default:
        aliases:
          - findgloed-public-api
    restart: always

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: always

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  findgloed_uploads:
  meilisearch_data:
  meilisearch_runtime:

networks:
  findgloed_app_edge:
    external: true
    name: findgloed-app-edge
